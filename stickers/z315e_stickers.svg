<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="80mm" viewBox="0 0 120 80">
  <!-- Print at 100 % on white or clear sticker paper. Dimensions are in millimetres and match the bricks. -->
  <style>
    .t { font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif; font-weight: 700; }
    .cap { font-family: Arial, sans-serif; font-size: 2.2px; fill: #555; }
  </style>
  <rect width="120" height="80" fill="#fff"/>
  <text class="cap" x="4" y="5">Sidopanel, vänster och höger: över den gröna klossraden under gula randen (56 × 9,6 mm)</text>
  <g transform="translate(4,7)">
    <rect width="56" height="9.6" rx="0.6" fill="#367c2b"/>
    <text class="t" x="3" y="6.9" font-size="6.2" fill="#ffde00" textLength="36" lengthAdjust="spacingAndGlyphs">JOHN DEERE</text>
    <text class="t" x="42" y="6.6" font-size="4" fill="#d9e2d6" textLength="11" lengthAdjust="spacingAndGlyphs">Z315E</text>
  </g>
  <g transform="translate(62,7)">
    <rect width="56" height="9.6" rx="0.6" fill="#367c2b"/>
    <text class="t" x="3" y="6.9" font-size="6.2" fill="#ffde00" textLength="36" lengthAdjust="spacingAndGlyphs">JOHN DEERE</text>
    <text class="t" x="42" y="6.6" font-size="4" fill="#d9e2d6" textLength="11" lengthAdjust="spacingAndGlyphs">Z315E</text>
  </g>
  <text class="cap" x="4" y="24">Front under sätet: mörkgrå kloss 1 × 8 (64 × 9,6 mm)</text>
  <g transform="translate(4,26)">
    <rect width="64" height="9.6" rx="0.6" fill="#646464"/>
    <text class="t" x="20" y="7.4" font-size="7.4" fill="#e8e8e8" textLength="24" lengthAdjust="spacingAndGlyphs">Z315E</text>
  </g>
  <text class="cap" x="4" y="43">Fotstöd: svart platta 1 × 3</text>
  <g transform="translate(4,45)">
    <rect width="24" height="8" rx="0.6" fill="#1b2a34"/>
    <text class="t" x="2" y="5.5" font-size="4" fill="#ffde00" textLength="20" lengthAdjust="spacingAndGlyphs">JOHN DEERE</text>
  </g>
  <text class="cap" x="40" y="43">Utkastartrumma: på sluttningarna (2 st)</text>
  <g transform="translate(40,45)">
    <rect width="15" height="15" rx="0.8" fill="#ffde00"/>
    <path d="M7.5 2.2 L13 12.2 L2 12.2 Z" fill="none" stroke="#111" stroke-width="1.1" stroke-linejoin="round"/>
    <rect x="7" y="5.6" width="1" height="3.6" fill="#111"/><rect x="7" y="10" width="1" height="1" fill="#111"/>
  </g>
  <g transform="translate(58,45)">
    <rect width="15" height="15" rx="0.8" fill="#ffde00"/>
    <path d="M7.5 2.2 L13 12.2 L2 12.2 Z" fill="none" stroke="#111" stroke-width="1.1" stroke-linejoin="round"/>
    <rect x="7" y="5.6" width="1" height="3.6" fill="#111"/><rect x="7" y="10" width="1" height="1" fill="#111"/>
  </g>
  <text class="cap" x="4" y="70">Dekalerna är för privat bruk. John Deere är ett varumärke som tillhör Deere &amp; Company.</text>
</svg>
