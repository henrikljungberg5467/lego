<style>
/* Layout: one-screen workbench — 3D stage on the left, instruction rail on the right (stacks on phones). */
:root {
  --bg: #e9eee8;          /* workshop paper, faint green bias */
  --panel: #f7f9f5;
  --line: #c9d3c6;
  --fg: #18211a;
  --muted: #5b6a5d;
  --deere: #367c2b;       /* machine green */
  --deere-ink: #ffffff;
  --decal: #ffde00;       /* decal yellow, used only for the step badge */
  --decal-ink: #1d2310;
  --stage: #dfe6dd;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111612; --panel: #182019; --line: #2c372d; --fg: #e5ece3; --muted: #9aab9b;
    --deere: #5fae4f; --deere-ink: #0c1409; --decal: #ffde00; --decal-ink: #1d2310; --stage: #1b241c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111612; --panel: #182019; --line: #2c372d; --fg: #e5ece3; --muted: #9aab9b;
  --deere: #5fae4f; --deere-ink: #0c1409; --decal: #ffde00; --decal-ink: #1d2310; --stage: #1b241c;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box;
}
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 span { color: var(--deere); }
.spec { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 13px; }
.spec b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.downloads { margin-left: auto; align-self: center; display: flex; flex-wrap: wrap; gap: 6px; }
.downloads a { font: 600 13px var(--font-body); color: var(--fg); text-decoration: none; white-space: nowrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; }
.downloads a:hover { border-color: var(--deere); }
.downloads a:focus-visible { outline: 2px solid var(--deere); outline-offset: 2px; }
.downloads a.primary { background: var(--deere); color: var(--deere-ink); border-color: var(--deere); }
.downloads small { font-size: 12px; font-weight: 400; opacity: .8; margin-left: 3px; }
.stage { position: relative; min-height: 0; background: var(--stage); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--font-mono); font-size: 13px; }
.hint { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--muted); pointer-events: none; }
.rail { min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.stepper { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; }
.stepline { display: flex; align-items: center; gap: 12px; }
.badge.sub { background: var(--deere); color: var(--deere-ink); }
.badge { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; min-width: 64px; text-align: center; padding: 6px 8px 4px;
  background: var(--decal); color: var(--decal-ink); border-radius: 4px; font-variant-numeric: tabular-nums; }
.stepinfo { min-width: 0; }
.stepinfo .of { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stepinfo .sub { font-weight: 600; overflow-wrap: anywhere; }
.controls { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
button { font: 600 13px var(--font-body); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--deere); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--deere); outline-offset: 2px; }
button.primary { background: var(--deere); color: var(--deere-ink); border-color: var(--deere); }
input[type=range] { width: 100%; accent-color: var(--deere); }
.tabs { display: flex; gap: 4px; }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.list { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.list table { width: 100%; border-collapse: collapse; font-size: 13px; }
.list td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.list tr:last-child td { border-bottom: 0; }
.qty { font-family: var(--font-mono); font-weight: 500; white-space: nowrap; text-align: right; width: 1%; font-variant-numeric: tabular-nums; }
.sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; vertical-align: -2px; border: 1px solid rgba(0,0,0,.25); margin-right: 6px; }
.pn { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.caption { padding: 8px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
@media (max-width: 820px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; height: auto; }
  .stage { height: 58vh; min-height: 300px; }
  .list { max-height: 60vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>John Deere <span>Z315E</span> ZTrak i LEGO</h1>
    <div class="spec" id="spec">
      <span>Skala <b>1:8</b></span><span>Delar <b id="nparts">–</b></span><span>Byggsteg <b id="nsteps">–</b></span>
      <span>L × B × H <b>23 × 18 × 14 cm</b></span>
    </div>
    <nav class="downloads" aria-label="Ladda ner">
      <a class="primary" href="bygginstruktioner.pdf" download="Z315E_bygginstruktion.pdf">Bygginstruktion <small>PDF, __PDFSIZE__</small></a>
      <a href="pick_a_brick.csv" download="Z315E_pick_a_brick.csv" title="Ladda upp på LEGO Pick a Brick (alla delar utom bakdäcken)">Pick a Brick-lista <small>CSV</small></a>
      <a href="bricklink_inte_pa_pab.xml" download="Z315E_bakdack_bricklink.xml" title="Bakdäcken finns inte på Pick a Brick: ladda upp som önskelista på BrickLink">Bakdäck, BrickLink <small>XML</small></a>

  <aside class="rail">
    <div class="stepper">
      <div class="stepline">
        <div class="badge" id="badge">–</div>
        <div class="stepinfo"><div class="of" id="of">Steg – av –</div><div class="sub" id="sub">–</div></div>

        <button id="first" aria-label="Första steget">|◀</button>
        <button id="prev" aria-label="Föregående steg">◀</button>
        <input type="range" id="slider" min="0" max="1" value="1" aria-label="Byggsteg">
        <button id="next" class="primary" aria-label="Nästa steg">▶</button>
        <button id="last" aria-label="Färdig modell">▶|</button>
      </div>

    <div class="tabs" role="tablist">
      <button role="tab" id="tab-step" aria-selected="true">Delar i steget</button>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
</script>
<script>window.PARTDATA = __PARTDATA__;</script>
<script type="module">
import * as THREE from 'three';
import { LDrawLoader } from 'three/addons/loaders/LDrawLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const D = window.PARTDATA, P = D.plan;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(-1, 2, 1.5); scene.add(sun);
const camera = new THREE.PerspectiveCamera(32, 1, 1, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

function themeBg() { return getComputedStyle(document.documentElement).getPropertyValue('--stage').trim() || '#dfe6dd'; }
function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => scene.background = new THREE.Color(themeBg()));
new MutationObserver(() => scene.background = new THREE.Color(themeBg())).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
scene.background = new THREE.Color(themeBg());

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PART_MS = 480, MOUNT_MS = 1100, CAM_MS = 700;

const loader = new LDrawLoader();
loader.setPartsLibraryPath('./');
await loader.preloadMaterials('LDConfig.ldr');
const model = await loader.loadAsync('z315e_packed.mpd');
model.rotation.x = Math.PI;
scene.add(model);
model.updateMatrixWorld(true);

// Parts in file order, matched with the build plan (same order, computed when the viewer was built).
// Positions are LDraw coordinates in the part's parent: the model itself, or a sub-assembly placed at the origin.
const parts = [], subGroups = new Map();
model.traverse(g => {
  if (!g.isGroup || g === model) return;
  const f = (g.userData.fileName || '').toLowerCase();
  if (g.userData.type === 'Part' || /^[0-9a-z]+\.dat$/.test(f)) parts.push({ g, part: f.replace('.dat', ''), color: String(g.userData.colorCode), home: g.position.clone() });
  else if (f.endsWith('.ldr')) subGroups.set(f, g);
});
if (parts.length !== P.parts.length || parts.some((p, i) => p.part !== P.parts[i][0])) console.error('Byggplanen stämmer inte med modellen');
parts.forEach((p, i) => {
  const [, st, k, dx, dy, dz, travel] = P.parts[i];
  Object.assign(p, { st, k, travel, dir: new THREE.Vector3(dx, dy, dz), ctx: P.steps[st].ctx.toLowerCase() });
});
const N = P.steps.length;
const mountStep = {};
P.steps.forEach((S, i) => S.mounts.forEach(([sub]) => mountStep[sub.toLowerCase()] = i));

document.getElementById('nparts').textContent = parts.length;
document.getElementById('nsteps').textContent = N;
const slider = document.getElementById('slider');
slider.max = N; slider.value = N;
document.getElementById('loading').hidden = true;

// camera: frames what is shown in the step (the growing model, or the sub-assembly being built) and
// turns to the underside when the step's parts go on from below
function boxOf(list) { const b = new THREE.Box3(); for (const p of list) b.expandByObject(p.g); return b; }
function framing(box, zoomOut) {
  const c = box.getCenter(new THREE.Vector3()), r = Math.max(60, box.getSize(new THREE.Vector3()).length() / 2);
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2), hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  return { target: c, dist: zoomOut * 0.92 * r / Math.sin(Math.min(vHalf, hHalf)) };
}
resize();
{
  const f = framing(boxOf(parts), 1);
  controls.target.copy(f.target);
  camera.position.copy(f.target).addScaledVector(new THREE.Vector3(-Math.sin(1.05), 0.36, Math.cos(1.05)).normalize(), f.dist);
  controls.update();
}
let camTween = null;
function moveCamera(box, zoomOut, below) {
  const f = framing(box, zoomOut);
  const fromT = controls.target.clone(), fromD = camera.position.distanceTo(controls.target);
  const fromDir = camera.position.clone().sub(controls.target).normalize(), toDir = fromDir.clone();
  // a camera above the model has a positive y offset from the target
  if (below !== null && (toDir.y < 0) !== below) toDir.y = -toDir.y;
  if (below !== null && Math.abs(toDir.y) < 0.3) { toDir.y = below ? -0.45 : 0.36; toDir.normalize(); }
  if (fromT.distanceTo(f.target) < 1 && Math.abs(fromD - f.dist) < 0.05 * fromD && fromDir.distanceTo(toDir) < 0.01) return;
  camTween = { t0: performance.now(), fromT, toT: f.target, fromD, toD: f.dist, fromDir, toDir };
}

function rows(list) {
  const m = new Map();
  for (const p of list) { const k = p.part + '|' + p.color; m.set(k, (m.get(k) || 0) + 1); }
  return [...m.entries()].map(([k, n]) => { const [part, color] = k.split('|'); return { part, color, n }; })
    .sort((a, b) => (D.colors[a.color]?.[0] || '').localeCompare(D.colors[b.color]?.[0] || '', 'sv') || a.part.localeCompare(b.part));
}
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function table(rs, caption) {
  return (caption ? `<div class="caption">${esc(caption)}</div>` : '') + '<table>' + rs.map(r => {
    const [cn, hex] = D.colors[r.color] || [r.color, '#888'];
    return `<tr><td class="qty">${r.n}×</td><td><span class="sw" style="background:${hex}"></span>${esc(D.names[r.part] || r.part)}<div class="pn">${esc(r.part)} · ${esc(cn)}</div></td></tr>`;
  }).join('') + '</table>';
}
const title = S => P.sections[S.section] || S.section;

let step = 0, tab = 'step', anim = [], mounts = [], t0 = 0, camInit = false;
function show(i, animate = true) {
  step = Math.max(1, Math.min(N, i));
  const si = step - 1, S = P.steps[si], ctx = S.ctx.toLowerCase();
  anim = []; mounts = [];
  for (const g of subGroups.values()) g.position.set(0, 0, 0);
  for (const p of parts) {
    p.g.position.copy(p.home);
    p.g.visible = ctx !== 'main' ? (p.ctx === ctx && p.st <= si)
      : (p.ctx === 'main' ? p.st <= si : (mountStep[p.ctx] ?? Infinity) <= si);
    if (p.g.visible && p.st === si && animate && !reduce) anim.push(p);
  }
  anim.sort((a, b) => a.k - b.k);
  const gap = Math.min(150, 1300 / Math.max(1, anim.length));
  anim.forEach((p, j) => p.delay = j * gap);
  if (animate && !reduce) for (const [sub, dx, dy, dz, travel] of S.mounts)
    mounts.push({ g: subGroups.get(sub.toLowerCase()), dir: new THREE.Vector3(dx, dy, dz), travel });
  apply(0);
  // frame the visible parts at their final positions; for a mount, include the sub-assembly
  const shown = parts.filter(p => p.g.visible);
  for (const p of shown) p.g.position.copy(p.home);
  for (const g of subGroups.values()) g.position.set(0, 0, 0);
  model.updateMatrixWorld(true);
  const box = boxOf(shown);
  apply(0);
  const ups = anim.filter(p => p.dir.y > 0.5).length + mounts.filter(m => m.dir.y > 0.5).length;
  const moving = anim.length + mounts.length;
  const below = !moving ? null : ups * 2 >= moving;
  if (camInit) moveCamera(box, S.mounts.length ? 1.15 : 1, below);
  slider.value = step;
  const badge = document.getElementById('badge');
  badge.textContent = step;
  badge.classList.toggle('sub', ctx !== 'main');
  document.getElementById('of').textContent = `Steg ${step} av ${N}`;
  document.getElementById('sub').textContent = ctx !== 'main' ? `Delmontering: ${title(S)}`
    : S.mounts.length ? `Montera: ${title(S)}` : title(S);
  renderList();
  t0 = performance.now();
}
function apply(el) {
  const ease = k => Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
  for (const p of anim) p.g.position.copy(p.home).addScaledVector(p.dir, p.travel * ease((el - p.delay) / PART_MS));
  for (const m of mounts) m.g.position.copy(m.dir).multiplyScalar(m.travel * ease((el - 200) / MOUNT_MS));
}
function renderList() {
  const si = step - 1, S = P.steps[si];
  const list = document.getElementById('list');
  if (tab === 'all') { list.innerHTML = table(rows(parts), `${parts.length} delar totalt`); return; }
  if (S.mounts.length) { list.innerHTML = `<div class="caption">Inga nya delar: sätt den färdiga delmonteringen „${esc(title(S))}” på plats.</div>`; return; }
  const cur = parts.filter(p => p.st === si);
  list.innerHTML = table(rows(cur), `${cur.length} delar i det här steget`);
}
document.getElementById('first').onclick = () => show(1);
document.getElementById('prev').onclick = () => show(step - 1);
document.getElementById('next').onclick = () => show(step + 1);
document.getElementById('last').onclick = () => show(N);
slider.oninput = () => show(+slider.value);
for (const [id, t] of [['tab-step', 'step'], ['tab-all', 'all']]) {
  document.getElementById(id).onclick = () => {
    tab = t;
    document.getElementById('tab-step').setAttribute('aria-selected', t === 'step');
    document.getElementById('tab-all').setAttribute('aria-selected', t === 'all');
    renderList();
  };
}
addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(step + 1); if (e.key === 'ArrowLeft') show(step - 1); });
show(N, false);
camInit = true;

renderer.setAnimationLoop(now => {
  apply(now - t0);
  if (camTween) {
    const k = Math.min(1, (now - camTween.t0) / CAM_MS), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    const dir = camTween.fromDir.clone().lerp(camTween.toDir, e).normalize();
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    camera.position.copy(controls.target).addScaledVector(dir, camTween.fromD + (camTween.toD - camTween.fromD) * e);
    if (k >= 1) camTween = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
window.__viewer = { show, N: () => N, ok: () => parts.length === P.parts.length && parts.every((p, i) => p.part === P.parts[i][0]) };
</script>
